<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>milkinit.d</title>
    <meta name="description" content="A small personal website.">
    <style>
            /* =========================
               Main color variables
            ========================= */
            
            :root {
                --bg: #070708;
                --red: #ac3232;
                --dark-red: #52263e;
                --pink: #d96b78;
                --text: #d8bfc5;
                --muted: #8f6f78;
                --mono: "Courier New", monospace;
                --serif: Georgia, serif;
            }
            
            /* =========================
               Reset
            ========================= */
            
            * {
                box-sizing: border-box;
            }
            
            html {
                scroll-behavior: smooth;
            }
            
            body {
                margin: 0;
                min-height: 100vh;
                background:
            linear-gradient(rgba(8, 8, 15, 0.92), rgba(8, 8, 15, 0.96)),
            repeating-linear-gradient(0deg,
                transparent 0,
                transparent 3px,
                rgba(172, 50, 50, 0.04) 4px);
                color: var(--text);
                font-family: var(--mono);
                line-height: 1.6;
            }
            
            /* =========================
               Main container
            ========================= */
            
            main {
                width: min(900px, calc(100% - 40px));
                margin: 0 auto;
                padding: 40px 0;
            }
            
            /* =========================
               Header
            ========================= */
            
            .page_header {
                display: flex;
                align-items: center;
                gap: 22px;
                padding: 28px 0;
                min-width: 0;
                border-bottom: 1px solid var(--dark-red);
            }
            
            .page_header img {
                width: 150px;
                height: 150px;
                object-fit: cover;
                flex-shrink: 0;
                border: 1px solid var(--red);
                filter: grayscale(30%) contrast(110%);
                box-shadow:
            0 0 8px rgba(172, 50, 50, 0.7),
            0 0 25px rgba(82, 38, 62, 0.8);
            }
            
            .page_header h1 {
                margin: 0;
                color: var(--red);
                font-family: var(--serif);
                font-size: clamp(30px, 6vw, 56px);
                font-weight: normal;
                letter-spacing: 0.08em;
                line-height: 1.1;
                text-shadow: 0 0 10px rgba(172, 50, 50, 0.8);
            }
            
            .page_header p {
                margin: 10px 0 0;
                color: var(--muted);
                font-size: 12px;
                letter-spacing: 0.12em;
            }
            
            /* =========================
               Links
            ========================= */
            
            a {
                color: var(--pink);
                text-decoration: none;
                transition:
            color 0.2s ease,
            text-shadow 0.2s ease,
            border-color 0.2s ease;
            }
            
            a:hover {
                color: #ff9aa6;
                text-shadow: 0 0 8px var(--pink);
            }
            
            /* =========================
               Intro text
            ========================= */
            
            .intro {
                padding: 35px 0;
                color: var(--text);
                font-size: 14px;
            }
            
            .intro p {
                max-width: 650px;
                margin: 0;
            }
            
            /* =========================
               Divider
            ========================= */
            
            hr.divider {
                border: none;
                border-top: double 1px var(--pink);
                opacity: 0.6;
                margin: 0;
            }
            
            /* =========================
               Section layout
            ========================= */
            
            .secare {
                display: grid;
                grid-template-columns: 220px 1fr;
                gap: 30px;
                align-items: center;
                padding: 30px 0;
                border-bottom: 1px solid var(--dark-red);
            }
            
            /* Image placeholder */
            
            .image-placeholder {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 150px;
                border: 1px solid var(--red);
                background:
            linear-gradient(135deg,
                rgba(172, 50, 50, 0.12),
                rgba(82, 38, 62, 0.25));
                color: var(--muted);
                font-size: 12px;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                box-shadow:
            inset 0 0 20px rgba(82, 38, 62, 0.5),
            0 0 10px rgba(172, 50, 50, 0.25);
            }
            
            .image-placeholder::before {
                content: "[ ";
                color: var(--red);
            }
            
            .image-placeholder::after {
                content: " ]";
                color: var(--red);
            }
            
            /* Section labels */
            
            .label {
                color: var(--text);
                font-size: 13px;
            }
            
            .label a {
                display: inline-block;
                margin-bottom: 8px;
                color: var(--red);
                font-family: var(--serif);
                font-size: 22px;
                letter-spacing: 0.08em;
                text-transform: lowercase;
                border-bottom: 1px solid transparent;
            }
            
            .label a:hover {
                border-color: var(--pink);
            }
            
            .label br+* {
                color: var(--muted);
            }
            
            /* =========================
               HUD link
            ========================= */
            
            .hud-link {
                font-family: var(--mono);
                font-size: 12px;
                color: var(--pink);
                text-decoration: none;
                letter-spacing: 0.15em;
                border-bottom: 1px solid transparent;
                transition:
            border-color 0.2s,
            text-shadow 0.2s;
            }
            
            .hud-link:hover {
                border-color: var(--pink);
                text-shadow: 0 0 8px var(--pink);
            }
            
            /* =========================
               Footer
            ========================= */
            
            .site-footer {
                padding: 35px 0 10px;
                color: var(--muted);
                font-size: 11px;
                letter-spacing: 0.12em;
                text-align: center;
            }
            
            .site-footer p {
                margin: 0;
            }
            
            /* =========================
               Mobile layout
            ========================= */
            
            @media (max-width: 600px) {
                main {
            width: min(100% - 28px, 900px);
            padding: 20px 0;
                }
            
                .page_header {
            align-items: flex-start;
            gap: 15px;
            padding-top: 15px;
                }
            
                .page_header img {
            width: 90px;
            height: 90px;
                }
            
                .page_header h1 {
            font-size: 30px;
                }
            
                .page_header p {
            font-size: 10px;
                }
            
                .secare {
            grid-template-columns: 1fr;
            gap: 18px;
            padding: 25px 0;
                }
            
                .image-placeholder {
            min-height: 120px;
                }
            
                .label a {
            font-size: 20px;
                }
            }

    </style>
</head>

<body>

    <main class="site">
<section class="secare">
    <div class="image-placeholder">01</div>
    <div class="label">
<a href="https://github.com/milkinit/DDot-Lain">DDot-Lain</a><br>
A lightweight Debian-based desktop<br>environment inspired by Serial Experiments Lain.
    </div>
</section>

<section class="secare">
    <div class="image-placeholder">02</div>
    <div class="label">
<a href="https://github.com/milkinit/AniScraper">AniScraper</a><br>
A CLI tool that scrapes MyAnimeList's top anime rankings and <br>randomly picks one for you to watch - no more endless scrolling.
    </div>
</section>

    </main>

</body>

</html>
